name: RDP_UNLIMITED_HAN
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Prepare-RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Setup-Ngrok
      run: |
        curl -L -o ngrok.zip https://bin.equinox.io/c/bNy7z2qHfhm/ngrok-v3-stable-windows-amd64.zip
        tar -xf ngrok.zip
    - name: Auth-Connect
      run: |
        .\ngrok.exe authtoken ${{ secrets.TOKEN_NGROK_TUAN }}
        .\ngrok.exe tcp 3389
        

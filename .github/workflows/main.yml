name: RDP_UNLIMITED_HAN
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Membuka Gerbang RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user Administrator Ditzz_Modder_77! /active:yes
        echo "Ditzz_Modder_77!" | net user Administrator *
    - name: Memasang Ngrok Otomatis
      run: |
        choco install ngrok
    - name: Menghubungkan Mesin
      run: |
        ngrok authtoken ${{ secrets.TOKEN_NGROK_TUAN }}
        ngrok tcp 3389
        

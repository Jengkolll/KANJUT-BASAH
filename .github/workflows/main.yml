name: RDP_DITZZ_BANTAI_TOTAL
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. Setup RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin Ditzz77!

    - name: 2. Download Ngrok (Jalur Kilat)
      run: |
        curl -L --output ngrok.zip https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip
        tar -xf ngrok.zip

    - name: 3. JALANKAN NGROK (LINK PASTI MUNCUL)
      run: |
        Write-Host "Sabar Tuan Han, Ngrok lagi buat jalan kasta Sultan..."
        # Kita jalankan langsung, link akan muncul di baris log!
        ./ngrok.exe tcp --region ap 3389
        

name: RDP_UNLIMITED_HAN
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Prepare-RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Setup-Ngrok
      run: |
        Invoke-WebRequest https://github.com/ngrok/ngrok-v3-windows/releases/download/v3.18.4/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .
    - name: Auth-Connect
      run: |
        .\ngrok.exe authtoken ${{ secrets.TOKEN_NGROK_TUAN }}
        .\ngrok.exe tcp 3389
        

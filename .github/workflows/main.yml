name: RDP_DITZZ_SULTAN_FINAL
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. Persiapan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin Ditzz77!

    - name: 2. Download Cloudflared
      run: |
        curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

    - name: 3. JALANKAN TUNNEL (AMBIL LINK DI SINI)
      run: |
        Write-Host "Tunggu 15 detik, link bakal muncul di bawah..."
        ./cloudflared.exe tunnel --url tcp://localhost:3389
        

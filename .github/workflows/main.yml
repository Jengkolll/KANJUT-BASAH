name: RDP_DITZZ_FINAL_LINK
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: 1. Aktifkan RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        net user runneradmin Ditzz77!

    - name: 2. Pasang Cloudflared
      run: |
        curl -L --output cloudflared.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

    - name: 3. Jalankan Tunnel & Tampilkan Link
      run: |
        Start-Process .\cloudflared.exe -ArgumentList "tunnel --url tcp://localhost:3389"
        Write-Host "Menunggu terowongan Sultan terbuka..."
        Start-Sleep -s 30
        $output = curl.exe -s http://127.0.0.1:4040/metrics
        if ($output -match 'hostname="([^"]+)"') {
            Write-Host "`n------------------------------------------"
            Write-Host "ALAMAT RDP TUAN: $($matches[1])"
            Write-Host "USER: runneradmin"
            Write-Host "PASS: Ditzz77!"
            Write-Host "------------------------------------------"
        } else {
            Write-Host "Link belum muncul di metrics, cek manual di bawah ini:"
            ./cloudflared.exe tunnel --url tcp://localhost:3389
        }
        Start-Sleep -s 21600
        
